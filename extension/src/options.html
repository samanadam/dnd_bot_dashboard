<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal sync settings</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { padding: 24px 16px; }
      main { max-width: 680px; margin: 0 auto; display: grid; gap: 14px; }
      header img { width: 36px; height: 36px; border-radius: 8px; }
      table { width: 100%; border-collapse: collapse; } th { text-align: left; font-size: 12px; color: var(--muted); }
      td, th { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
      .log { max-height: 260px; overflow: auto; font-size: 12px; display: grid; gap: 4px; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="options.js"></script>
  </body>
</html>

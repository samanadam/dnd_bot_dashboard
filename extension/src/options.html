<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal sync settings</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { padding: 28px 16px 48px; }
      main { max-width: 900px; margin: 0 auto; }
      header img { width: 40px; height: 40px; border-radius: 10px; }
      .layout { display: grid; grid-template-columns: 180px 1fr; gap: 20px; margin-top: 20px; align-items: start; }
      nav { position: sticky; top: 20px; display: grid; gap: 2px; }
      nav a { color: var(--muted); text-decoration: none; padding: 7px 10px; border-radius: 8px; font-weight: 550; }
      nav a:hover { color: var(--text); background: var(--surface-2); }
      section { scroll-margin-top: 20px; }
      .log { max-height: 280px; overflow: auto; font-size: 12px; display: grid; gap: 4px; margin-top: 8px; font-family: "Geist Mono", ui-monospace, monospace; }
      @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } nav { position: static; display: flex; flex-wrap: wrap; } }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="options.js"></script>
  </body>
</html>

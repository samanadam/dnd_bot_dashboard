<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal sync</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 372px; padding: 14px; }
      header img { width: 30px; height: 30px; border-radius: 8px; }
      .live { display: grid; gap: 6px; margin-top: 12px; }
      .live.on { border-color: rgb(61 220 151 / 0.45); }
      .char-actions { display: flex; gap: 6px; margin-top: 8px; }
      .roll { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-top: 1px solid var(--border); }
      .roll:first-child { border-top: 0; }
      .total { font-weight: 700; font-variant-numeric: tabular-nums; }
      footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="popup.js"></script>
  </body>
</html>
